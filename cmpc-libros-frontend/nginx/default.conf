server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Archivos con hash en el nombre (JS, CSS, fuentes): se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: toda ruta de cliente (/books, /books/new, /login…) devuelve index.html.
    # index.html no se cachea: así una versión nueva se ve de inmediato.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
